spring.application.name=ratetheanime

# Railway entrega el puerto en la variable PORT.
# En local, si PORT no existe, usa 8080.
server.port=${PORT:8080}
server.address=0.0.0.0

# Base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3307}/${MYSQLDATABASE:ratetheanime}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones más liviano para Railway
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=300000

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Open-Meteo API
openmeteo.base-url=https://api.open-meteo.com

# Spring Security - JWT
jwt.secret=${JWT_SECRET:rateanime-clave-secreta-jwt-2026-cambiar-en-produccion}


